name: Clean up published sources for deleted branch
on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch folder to remove from bundles
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Clean up
        run: |
          echo "Clean up for branch ${{ inputs.target_branch }}"

      - name: Checkout Branch
        uses: actions/checkout@v5

      - name: Checkout existing bundles
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: gh-pages
          path: bundles

      - name: Remove branch folder
        run: rm -rf "bundles/${{ inputs.target_branch }}"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.6.0
        with:
          branch: gh-pages
          folder: bundles